name: 功能建议
description: 想要的功能、改进点或新的刀型思路
title: "【建议】"
body:
  - type: textarea
    id: idea
    attributes:
      label: 想法
      description: 想加什么、解决什么问题
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: 使用场景
      description: 平时怎么用的，这个功能会在哪一步帮到你
    validations:
      required: false
